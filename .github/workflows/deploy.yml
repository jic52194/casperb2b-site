name: Build & publish casperb2b.com
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci            # sharp is only used by npm run images (one-time image import); the build itself has no dependencies
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - name: IndexNow ping
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, urllib.request
          urls = [u for u in open("data/urls.txt").read().split() if u]
          body = json.dumps({"host": "casperb2b.com", "key": "78ac1779d5ca276756ec512bd5fde53e", "keyLocation": "https://casperb2b.com/78ac1779d5ca276756ec512bd5fde53e.txt", "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body, headers={"content-type": "application/json; charset=utf-8"})
          try: print("IndexNow", urllib.request.urlopen(req, timeout=30).status, len(urls))
          except Exception as e: print("IndexNow failed", e)
          PY
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
